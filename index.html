<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>あや式 なんでも主人公4コマ化</title>
    <style>
        :root { 
            --bg-color: #0d0d0f;
            --card-bg: #16161a;
            --accent-gold: linear-gradient(135deg, #f3d078 0%, #d4af37 50%, #aa7c11 100%);
            --text-gold: #e5c158;
            --text-main: #f3f3f6;
            --border-color: #2a2a32;
        }
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background: var(--bg-color); padding: 20px 15px; text-align: center; color: var(--text-main); }
        .card { background: var(--card-bg); border-radius: 24px; padding: 30px 25px; max-width: 420px; margin: auto; border: 1px solid var(--border-color); }
        h1 { background: var(--accent-gold); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 1.3rem; margin-bottom: 5px; font-weight: 800; }
        .sub-title { font-size: 0.8rem; color: var(--text-gold); margin-bottom: 20px; font-weight: 700; }
        .input-group { text-align: left; margin-bottom: 18px; }
        label { font-size: 0.75rem; font-weight: 700; color: var(--text-gold); display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
        input[type="text"], textarea { width: 100%; padding: 12px; background: #1f1f23; border: 1px solid var(--border-color); border-radius: 12px; box-sizing: border-box; font-size: 15px; color: var(--text-main); }
        
        .select-group { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 8px; }
        .select-tile-label { text-align: center; cursor: pointer; position: relative; }
        .select-tile-label input[type="radio"] { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
        .select-tile { padding: 8px 4px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 0.65rem; font-weight: 700; background: #1f1f23; color: #a1a1aa; transition: 0.2s; }
        input[type="radio"]:checked + .select-tile { background: var(--accent-gold); border-color: transparent; color: #0d0d0f; font-weight: 800; }
        
        .btn-generate { background: var(--accent-gold); color: #0d0d0f; border: none; width: 100%; padding: 16px; border-radius: 30px; font-weight: 800; cursor: pointer; margin-top: 15px; }
        #result-area { display: none; margin-top: 25px; text-align: left; }
        .prompt-text { font-size: 0.8rem; line-height: 1.5; white-space: pre-wrap; color: #e4e4e7; background: #1f1f23; padding: 15px; border-radius: 12px; border: 1px solid var(--border-color); }
        .btn-copy { background: transparent; color: var(--text-gold); border: 1px solid #d4af37; width: 100%; padding: 12px; border-radius: 25px; font-weight: 700; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>
<div class="card">
    <h1>あや式 なんでも主人公4コマ化</h1>
    <div class="sub-title">～文章4コマ召喚術～</div>
    
    <div class="input-group">
        <label>① 主人公の特徴</label>
        <input type="text" id="userFeatures" placeholder="例：お団子ヘア、眼鏡の女性">
    </div>

    <div class="input-group">
        <label>② 言語モード</label>
        <div class="select-group">
            <label class="select-tile-label"><input type="radio" name="mangaMode" value="ja" checked><div class="select-tile">🇯🇵 日本語</div></label>
            <label class="select-tile-label"><input type="radio" name="mangaMode" value="en"><div class="select-tile">🇺🇸 英語</div></label>
            <label class="select-tile-label"><input type="radio" name="mangaMode" value="canva"><div class="select-tile">🎨 文字なし</div></label>
        </div>
    </div>

    <div class="input-group">
        <label>③ 作画スタイル</label>
        <div class="select-group">
            <label class="select-tile-label"><input type="radio" name="artStyle" value="Normal" checked><div class="select-tile">✨ 普通</div></label>
            <label class="select-tile-label"><input type="radio" name="artStyle" value="Gag Manga"><div class="select-tile">🍏 ギャグ</div></label>
            <label class="select-tile-label"><input type="radio" name="artStyle" value="Cute Mascot"><div class="select-tile">🧸 ゆる</div></label>
            <label class="select-tile-label"><input type="radio" name="artStyle" value="Chibi"><div class="select-tile">🍭 ちび</div></label>
            <label class="select-tile-label"><input type="radio" name="artStyle" value="Sketch"><div class="select-tile">✍️ スケッチ</div></label>
            <label class="select-tile-label"><input type="radio" name="artStyle" value="Epic/Drama"><div class="select-tile">🔥 濃厚</div></label>
        </div>
        <div class="select-group" style="grid-template-columns: 1fr;">
            <label class="select-tile-label"><input type="radio" name="artStyle" value="American Comic"><div class="select-tile">🇺🇸 アメコミ風</div></label>
        </div>
    </div>

    <div class="input-group">
        <label>④ 4コマ目のオチ</label>
        <div class="select-group" style="grid-template-columns: repeat(4, 1fr);">
            <label class="select-tile-label"><input type="radio" name="endingType" value="funny" checked><div class="select-tile">🍏 笑</div></label>
            <label class="select-tile-label"><input type="radio" name="endingType" value="emotional"><div class="select-tile">🌸 感</div></label>
            <label class="select-tile-label"><input type="radio" name="endingType" value="calm"><div class="select-tile">☕ 脱</div></label>
            <label class="select-tile-label"><input type="radio" name="endingType" value="special"><div class="select-tile">💥 特</div></label>
        </div>
    </div>

    <div class="input-group">
        <label>⑤ 原作テキスト</label>
        <textarea id="noteContent" rows="4"></textarea>
    </div>
    <button class="btn-generate" onclick="generateMangaPrompt()">最強プロンプトを召喚</button>
    <div id="result-area">
        <div id="promptText" class="prompt-text"></div>
        <button class="btn-copy" onclick="copyToClipboard()">📋 コピー</button>
    </div>
</div>
<script>
    function copyToClipboard() { navigator.clipboard.writeText(document.getElementById('promptText').innerText).then(() => alert("コピーしました✨")); }
    function generateMangaPrompt() {
        var features = document.getElementById('userFeatures').value;
        var mode = document.querySelector('input[name="mangaMode"]:checked').value;
        var style = document.querySelector('input[name="artStyle"]:checked').value;
        var ending = document.querySelector('input[name="endingType"]:checked').value;
        var text = document.getElementById('noteContent').value;
        
        var modeInstruction = (mode === "ja") ? "[DIALOGUE: Japanese]" : (mode === "en" ? "[DIALOGUE: English]" : "[NO TEXT/BALLOONS]");
        var endingInstruction = "";
        if (ending === "funny") endingInstruction = "PANEL 4: High-impact comedic punchline. Prioritize bizarre, surreal, or hilariously exaggerated reactions.";
        else if (ending === "emotional") endingInstruction = "PANEL 4: Touching resolution. [VARIETY PROTOCOL: If you are tempted to draw a sunset/thank you, override it with 70% probability to show an intimate, messy workspace moment.]";
        else if (ending === "calm") endingInstruction = "PANEL 4: Relaxed conclusion. [VARIETY PROTOCOL: If you are tempted to draw a drink, override it with 70% probability to show them staring into space or tidying.]";
        else if (ending === "special") endingInstruction = "PANEL 4: The 'AI Analytical Punchline'. The AI screen displays a cold, mocking, and unique analytical truth. Tone: condescending.";

        var finalPrompt = `[ASPECT RATIO 9:32]\nStyle: ${style} Manga. Character: ${features}\n\n` +
            `[CRITICAL: Keep consistent background/context across 4 panels. Use character traits. IGNORE reference background/items.]\n\n` +
            `PANEL 1: Wide shot, establish setting based on story.\n` +
            `PANEL 2: Close-up, dramatic facial expression.\n` +
            `PANEL 3: Medium shot, character action.\n` +
            `${endingInstruction}\n${modeInstruction}\n\n` +
            `[DYNAMIC CAMERA: EACH PANEL MUST USE DIFFERENT COMPOSITIONAL STRATEGY. Avoid standard eye-level shots.]\n\n` +
            `[STORY]: ${text}`;
        
        document.getElementById('promptText').innerText = finalPrompt;
        document.getElementById('result-area').style.display = "block";
    }
</script>
</body>
</html>
